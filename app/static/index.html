<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VORTEX — Video Downloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/api.js"></script>

  <div id="dropdown" style="position: relative;"></div>

  <div class="app">

    <!-- HEADER -->
    <header>
      <div>
        <div class="logo">VORTEX</div>
        <div class="tagline">// video downloader engine</div>
      </div>
      <div class="site-tags">
        <span class="site-tag">YOUTUBE</span>
        <span class="site-tag">VIMEO</span>
        <span class="site-tag">TWITTER/X</span>
        <span class="site-tag">INSTAGRAM</span>
        <span class="site-tag">TIKTOK</span>
        <span class="site-tag">+1000 MORE</span>
      </div>
    </header>

    <!-- URL INPUT -->
    <div class="input-section">
      <div class="input-label">// paste video url</div>
      <div class="url-row">
        <div id="urlInputs" style="display: flex; width: 100%; flex-direction: column; gap: 10px;">
          <input class="url-input" id="urlInput" type="text" placeholder="https://www.youtube.com/watch?v=..."
            autocomplete="off" spellcheck="false" />
        </div>
        <div>
          <button class="btn btn-primary" id="fetchBtn" onclick="handleFetch()">
            <span id="fetchBtnIcon">⚡</span> Fetch
          </button>
        </div>
      </div>

      <div class="folder-row">
        <div class="folder-display" id="folderDisplay">
          <span class="folder-icon">📁</span><span id="folderPath">Loading...</span>
        </div>
        <button class="btn btn-secondary" id="browseBtn" onclick="openFolderPicker()">Browse</button>
      </div>
      <div class="url-row" style="margin-top:10px">
        <input class="url-input" id="proxyInput" type="text"
          placeholder="Proxy (optional) — e.g. http://127.0.0.1:2090 or socks5://127.0.0.1:1080" autocomplete="off"
          spellcheck="false" onchange="saveProxy()" style="font-size:12px;color:var(--text2)" />
      </div>
      <div class="folder-row" style="margin-top:10px">
        <div class="folder-display" id="cookieDisplay">
          <span style="margin-right:8px">🍪</span><span id="cookiePath">No cookie file set</span>
        </div>
        <button class="btn btn-secondary" id="cookieBtn" onclick="pickCookieFile()">Browse</button>
        <button class="btn btn-secondary" onclick="clearCookieFile()" style="padding:12px 14px">✕</button>
      </div>
    </div>
    <!-- QUEUE -->
    <div class="queue-section">
      <div class="queue-header">
        <div class="queue-title">QUEUE</div>
        <div class="queue-count" id="queueCount">0</div>
        <div class="queue-actions">

          <button class="btn btn-cyan" onclick="startAll()">▶ Start All</button>
          <button class="btn btn-secondary" id="redownloadMissingBtn" onclick="redownloadAllMissing()"
            style="display:none">↺ Redownload Missing</button>
          <button class="btn btn-secondary" onclick="clearDone()">Clear Done</button>
          <button class="btn btn-danger" onclick="clearAll()">Clear All</button>
        </div>
      </div>

      <div class="queue-empty" id="queueEmpty" style="user-select: none;">
        <div class="queue-empty-icon">📭</div>
        <div>NO VIDEOS IN QUEUE</div>
        <div style="margin-top:6px;opacity:.6">paste a url above to get started</div>
      </div>

      <div class="filter-bar" id="filterBar" style="display:none">
        <input class="filter-search" id="filterSearch" placeholder="🔍 Search titles..." oninput="handleFilterQuery(this.value)" />
        <div class="filter-chips" id="filterChips">
          <button class="chip active" onclick="handleFilterStatus(this, 'all')">All</button>
          <button class="chip" onclick="handleFilterStatus(this, STATUS.QUEUED)">Queued</button>
          <button class="chip" onclick="handleFilterStatus(this, STATUS.DOWNLOADING)">Downloading</button>
          <button class="chip" onclick="handleFilterStatus(this, STATUS.DONE)">Done</button>
          <button class="chip" onclick="handleFilterStatus(this, STATUS.ERROR)">Error</button>
        </div>
        <div class="filter-chips" id="siteChips"></div>
        <select class="filter-search" id="sortSelect" onchange="handleSort(this.value)" style="width:auto;padding:7px 10px">
          <option value="date-desc">Newest first</option>
          <option value="date-asc">Oldest first</option>
          <option value="title-asc">Title A–Z</option>
          <option value="title-desc">Title Z–A</option>
          <option value="status">By status</option>
        </select>
      </div>
      <div class="job-list" id="jobList"></div>
    </div>
  </div>

  <!-- VIDEO PLAYER -->
  <div class="player-overlay" id="playerOverlay">
    <div class="player-wrap">
      <div class="player-topbar">
        <button class="p-btn" onclick="closePlayer()" title="Close">✕</button>
        <div class="player-title" id="playerTitle">—</div>
        <span class="player-site-badge" id="playerSiteBadge"></span>
      </div>
      <div class="player-video-area">
        <div class="player-main">
          <video id="mainVideo" preload="auto"></video>
        </div>
        <div class="player-sidebar">
          <div class="player-sidebar-title">// up next</div>
          <div class="player-playlist" id="playerPlaylist"></div>
        </div>
      </div>
      <div class="player-controls">
        <div class="player-progress-row">
          <span class="player-time" id="playerTimeCur">0:00</span>
          <input type="range" class="seek-bar" id="seekBar" min="0" max="1000" value="0" />
          <span class="player-time" id="playerTimeDur">0:00</span>
        </div>
        <div class="player-btn-row">
          <button class="p-btn" id="btnShuffle" onclick="toggleShuffle()" title="Shuffle">⇄</button>
          <button class="p-btn" onclick="playPrev()" title="Previous">⏮</button>
          <button class="p-btn play-btn" id="btnPlayPause" onclick="togglePlay()">▶</button>
          <button class="p-btn" onclick="playNext()" title="Next">⏭</button>
          <button class="p-btn" id="btnRepeatOne" onclick="toggleRepeatOne()" title="Repeat one">↺</button>
          <button class="p-btn" id="btnLoopAll" onclick="toggleLoopAll()" title="Loop queue">⟳</button>
          <div class="player-spacer"></div>
          <div class="vol-wrap">
            <button class="p-btn" id="btnMute" onclick="toggleMute()" title="Mute">🔊</button>
            <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.02" value="1"
              oninput="setVolume(this.value)" />
          </div>
          <select class="speed-select" id="speedSelect" onchange="setSpeed(this.value)">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
            <option value="3">3×</option>
          </select>
          <button class="p-btn" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
        </div>
      </div>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox-bg" id="lightboxBg" onclick="closeLightbox()">
    <div class="wrapper" style="display:flex;flex-direction:column;align-items:center;gap:12px" onclick="event.stopPropagation()">
      <img id="lightboxImg" src=""
        style="max-width:90vw;max-height:80vh;border-radius:var(--radius);box-shadow:0 0 80px rgba(0,0,0,.9)" />
      <div style="display:flex;gap:10px">
        <button class="btn btn-primary" onclick="saveLightboxImage()">⬇ Save Image</button>
        <button class="btn btn-secondary" onclick="copyLightboxImage()">⧉ Copy Image</button>
        <button class="btn btn-secondary" onclick="closeLightbox()">Close</button>
      </div>
    </div>
  </div>

  <!-- TOASTS -->
  <div class="toast-container" id="toastContainer"></div>
  
  <script src="/static/js/card.js"></script>
  <script src="/static/js/script.js"></script>
  
  <script src="/static/js/folder.js"></script>
  <script src="/static/js/proxy.js"></script>
  <script src="/static/js/cookie.js"></script>
  
  <script src="/static/js/lightbox.js"></script>
  <script src="/static/js/player.js"></script>
  <script src="/static/js/dropdown.js"></script>

</body>

</html>
